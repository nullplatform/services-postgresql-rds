name: tests

on:
  pull_request:
    branches:
      - main

jobs:
  do-tofu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [rds-postgres-db, rds-postgres-server]
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/do_tofu_version.sh ${{ matrix.package }}/scripts/aws/do_tofu

  provider-lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/provider_lookup.sh

  external-kms-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/external_kms_key.sh
