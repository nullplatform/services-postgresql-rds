name: tests-state-bucket

on:
  pull_request:
    branches:
      - main

jobs:
  state-bucket:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [rds-postgres-db, rds-postgres-server]
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/state_bucket.sh ${{ matrix.package }}
